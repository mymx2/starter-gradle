# 应用包名（唯一标识，装到设备按此区分；dev/staging 自动加 .dev/.staging 后缀，真机可同装多环境）
android.applicationId=io.github.mymx2.android
# 应用名（APK 文件名用，简短；不配则回退 applicationId）
android.applicationName=demo
# 版本（SemVer）
version=1.0.0

# 签名四件，全填空则 release 保持 unsigned。
# storeFile 必须解析到仓库内（相对项目根），keystore 不入库。
android.signing.storeFile=
android.signing.storePassword=
android.signing.keyAlias=
android.signing.keyPassword=
